name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # epubcheck is the merge gate from spec section 12: zero errors against
      # every corpus output.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install epubcheck
        uses: ./.github/actions/apt-install
        with:
          packages: epubcheck

      - name: Build
        run: go build ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Lint (staticcheck)
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Test with race detector
        run: go test -race ./...

      - name: Verify the module is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Real-world corpus. py-pdf/sample-files is CC-BY-SA-4.0, so it is fetched
  # here rather than vendored into this MIT repository. The job is pinned to a
  # commit in the Makefile so results are reproducible; bump it deliberately
  # and regenerate the manifest.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install epubcheck and poppler
        uses: ./.github/actions/apt-install
        with:
          packages: epubcheck poppler-utils

      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: testdata/corpus/py-pdf
          key: corpus-${{ hashFiles('Makefile') }}

      - name: Fetch the corpus
        run: make corpus

      # The golden manifest is the regression gate: a structure fingerprint
      # per file, per spec section 10. Drift on a file the change did not
      # intend to touch is the signal this exists to produce.
      - name: Corpus manifest
        run: go test -run TestCorpusManifest ./...

      - name: Corpus metadata matches the index
        run: go test -run TestCorpusMatchesIndex ./...

      - name: Corpus determinism
        run: go test -run TestCorpusDeterminism ./...

      - name: Corpus reading order against pdftotext
        run: go test -run TestCorpusReadingOrder ./...

      - name: Corpus epubcheck validation
        run: go test -run TestCorpusEPUBCheck ./...

      # Measured here rather than in the test job because that job has no
      # corpus, so every corpus test skips and the total lands about seven
      # points lower -- 80.3% against 87.3% -- which would make the floor
      # measure how much of the suite ran rather than how much code is
      # covered.
      - name: Coverage gate
        env:
          COVERAGE_THRESHOLD: "85.0"
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          threshold="${COVERAGE_THRESHOLD}"
          echo "coverage ${total}% against a ${threshold}% floor"
          awk -v t="$total" -v f="$threshold" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the ${threshold}% floor"
            exit 1
          }

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out


  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # A short smoke fuzz on every push. Malformed PDFs are a hostile input
      # class per spec section 10; the parser must not panic or allocate
      # without bound.
      - name: Fuzz the content stream lexer
        run: go test -run XXX -fuzz FuzzLexer -fuzztime 60s ./internal/pdf/

      - name: Fuzz the content stream interpreter
        run: go test -run XXX -fuzz FuzzInterpret -fuzztime 60s ./internal/pdf/

      - name: Fuzz the xref parser
        run: go test -run XXX -fuzz FuzzOpen -fuzztime 60s ./internal/pdf/

      - name: Fuzz the CMap parser
        run: go test -run XXX -fuzz FuzzParseCMap -fuzztime 60s ./internal/pdf/

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: internal/pdf/testdata/fuzz/

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # Spec principle 2: a cross-compiled static binary with no cgo is a
      # hard requirement.
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/decant
