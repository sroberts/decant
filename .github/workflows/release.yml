name: Release

# Cutting a release is "git tag -a vX.Y.Z && git push origin vX.Y.Z".
# Everything below follows from that.
#
# The annotated tag's message becomes the release notes, so the notes are
# written once, in the tag, and the repository carries them whether or not
# GitHub is reachable. Generated commit lists are not used: a release note
# should say what changed for someone using the tool, which a commit list
# does not.
on:
  push:
    tags: ["v*"]
  # For rehearsing the workflow against an existing tag without cutting a new
  # one. It still refuses to publish over a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag object itself is needed for its message, and the default
          # shallow fetch does not bring it.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # actions/checkout leaves the tag as a lightweight ref, which has no
      # message. Refetching restores the annotation.
      - name: Restore tag annotations
        run: git fetch --force --tags

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # A release must not ship code that does not pass its own gate. The
      # corpus and fuzz jobs in ci.yml have already run on the commit being
      # tagged; this is the part that is cheap enough to repeat and fatal
      # enough to matter.
      - name: Verify
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt"; exit 1; }
          go vet ./...
          go test ./...

      - name: Build
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="dist/decant-${TAG}-${os}-${arch}${ext}"
            # -trimpath keeps build paths out of the binary, and the version
            # is stamped so the binary reports the tag rather than falling
            # back to build info.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags="-s -w -X main.version=${TAG}" \
              -o "$out" ./cmd/decant
          done
          cd dist && sha256sum * > SHA256SUMS
          ls -la

      # The binary for this runner is the one that can be executed here, and
      # a release reporting the wrong version is the failure this workflow
      # exists to prevent.
      - name: Check the stamped version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          got="$(./dist/decant-${TAG}-linux-amd64 version)"
          echo "$got"
          case "$got" in
            "decant ${TAG} "*) ;;
            *) echo "expected 'decant ${TAG} ...'"; exit 1 ;;
          esac

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite it"
            exit 1
          fi
          # The tag message minus its first line, which is the title.
          git tag -l --format='%(contents)' "$TAG" | tail -n +2 > notes.md
          if [ ! -s notes.md ]; then
            echo "tag $TAG carries no annotation; write one with git tag -a"
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            dist/*
