name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      # epubcheck is the merge gate from spec section 12: zero errors against
      # every corpus output.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install epubcheck
        run: |
          sudo apt-get update && sudo apt-get install -y epubcheck

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Test with race detector
        run: go test -race ./...

      - name: Verify the module is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      # A short smoke fuzz on every push. Malformed PDFs are a hostile input
      # class per spec section 10; the parser must not panic or allocate
      # without bound.
      - name: Fuzz the content stream lexer
        run: go test -run XXX -fuzz FuzzLexer -fuzztime 60s ./internal/pdf/

      - name: Fuzz the content stream interpreter
        run: go test -run XXX -fuzz FuzzInterpret -fuzztime 60s ./internal/pdf/

      - name: Fuzz the xref parser
        run: go test -run XXX -fuzz FuzzOpen -fuzztime 60s ./internal/pdf/

      - name: Fuzz the CMap parser
        run: go test -run XXX -fuzz FuzzParseCMap -fuzztime 60s ./internal/pdf/

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: internal/pdf/testdata/fuzz/

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      # Spec principle 2: a cross-compiled static binary with no cgo is a
      # hard requirement.
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/decant
